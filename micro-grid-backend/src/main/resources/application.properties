spring.application.name=backend

# NREL PVWatts key. Free, no card: https://developer.nrel.gov/signup/
# Supply it as the NREL_API_KEY environment variable; blank disables PVWatts.
nrel.api.key=${NREL_API_KEY:}

# --- Council dashboard -------------------------------------------------------
# The Energy Equity Challenge data lives in SQLite beside the app. The file is
# built on first start from src/main/resources/data and is gitignored; delete
# microgrid.db to force a reload.
spring.datasource.url=jdbc:sqlite:microgrid.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite takes a write lock over the whole file, and the loader writes the
# entire dataset in one transaction at startup. One connection keeps that
# honest; the dashboard only ever reads afterwards.
spring.datasource.hikari.maximum-pool-size=1

# Demo credentials for the council view. Override council.auth.password in a
# real deployment - see CouncilAuth.
