spring.application.name=backend

# Two profiles: dev (this machine) and prod (the deployed app). An environment
# variable outranks this file, so a container started with
# SPRING_PROFILES_ACTIVE=prod gets the production settings without a rebuild.
spring.profiles.active=dev

# NREL PVWatts key. Free, no card: https://developer.nrel.gov/signup/
# Supply it as the NREL_API_KEY environment variable; blank disables PVWatts.
nrel.api.key=${NREL_API_KEY:}

# --- Council dashboard -------------------------------------------------------
# The Energy Equity Challenge data lives in SQLite beside the app. The file is
# built on first start from src/main/resources/data and is gitignored; delete
# microgrid.db to force a reload.
spring.datasource.url=jdbc:sqlite:${MICRO_GRID_DB:microgrid.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite takes a write lock over the whole file, and the loader writes the
# entire dataset in one transaction at startup. One connection keeps that
# honest; the dashboard only ever reads afterwards.
spring.datasource.hikari.maximum-pool-size=1

# Demo credentials for the council view. Override council.auth.password in a
# real deployment - see CouncilAuth.

# --- reCAPTCHA Enterprise ----------------------------------------------------
# Off by default, and by default in tests. application-prod.properties turns it
# on; while it is off neither the interceptor nor the Google client is created,
# so nothing here needs credentials on a developer machine.
micro-grid.recaptcha.enabled=false
micro-grid.recaptcha.project-id=${RECAPTCHA_PROJECT_ID:sustainalens-506320}
micro-grid.recaptcha.site-key=${RECAPTCHA_SITE_KEY:6LfElZMtAAAAANQqPQwuxrZiGEPrA525f1tmgQtA}
# The Google Cloud API key the assessment call authenticates with. No default:
# it is a credential, so it comes from the environment or the app will not start
# with reCAPTCHA on. Restrict the key to the reCAPTCHA Enterprise API.
#
# Deliberately blank rather than falling back to the site key above. The two are
# not interchangeable - a site key authenticates the browser, this authenticates
# the server - and CreateAssessment refuses to start on either a blank key or one
# shaped like a site key. Blank makes that failure say "unset" rather than
# "wrong key", and keeps a credential-looking string out of a public repository.
micro-grid.recaptcha.api-key=${RECAPTCHA_API_KEY:}
# Below this reCAPTCHA score the request is refused. 0.0 is certainly a bot,
# 1.0 certainly a person; 0.5 is Google's own starting point.
micro-grid.recaptcha.min-score=${RECAPTCHA_MIN_SCORE:0.5}
# Ant patterns under /api that skip verification. Empty on purpose: every URL
# is verified in production.
micro-grid.recaptcha.exempt-paths=${RECAPTCHA_EXEMPT_PATHS:}
