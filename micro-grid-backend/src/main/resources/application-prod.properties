# --- Production --------------------------------------------------------------
# Activated with SPRING_PROFILES_ACTIVE=prod (or --spring.profiles.active=prod).
# Everything here reads an environment variable first so a deployment can be
# retargeted or its secrets rotated without a rebuild.

# The origin the Angular production build is served from - it must match
# environment.prod.ts's apiBaseUrl. Same-origin deployments never exercise
# this, but it is what makes a split api./www. split work.
micro-grid.cors.allowed-origins=${MICRO_GRID_ALLOWED_ORIGINS:https://sustainalens.com}

# --- reCAPTCHA Enterprise ----------------------------------------------------
# On: every request under /api has to carry a token that scores above
# min-score for the action its path implies. See RecaptchaInterceptor.
#
# The Google client authenticates with Application Default Credentials - the
# attached service account on GCP, or GOOGLE_APPLICATION_CREDENTIALS pointing
# at a key file anywhere else. The account needs
# roles/recaptchaenterprise.agent on the project. Without credentials the app
# fails at startup rather than quietly serving unverified traffic.
micro-grid.recaptcha.enabled=true

# --- Council sign-in ---------------------------------------------------------
# The demo defaults in CouncilAuth are in the repository. Set these.
council.auth.username=${COUNCIL_USERNAME:council}
council.auth.password=${COUNCIL_PASSWORD:Wollongong2026!}
council.auth.token=${COUNCIL_TOKEN:council-demo-token}

# The SQLite file is rebuilt from the packaged spreadsheets when it is absent,
# so a container should point MICRO_GRID_DB at its volume to keep it across
# restarts - the backend Dockerfile declares /home, so MICRO_GRID_DB=/home/microgrid.db.
# Deliberately not defaulted to that path here: an absolute POSIX path is not
# resolvable on a Windows machine running the prod profile, and the base
# application.properties already defaults it to a file beside the app.

# Stack traces are not the client's business.
server.error.include-stacktrace=never
server.error.include-message=never
