# Built-up density across the Illawarra, 0 = bush or sea, 255 = fully urban.
#
# Derived from the OpenStreetMap basemap: residential, retail, commercial and
# industrial land render as low-saturation grey there, so those pixels were
# counted at zoom 12 (31.5 m/px) and smoothed over a 900 m radius. Sampled on
# an 800 m lattice, which is finer than the smoothing, so bilinear lookup
# rebuilds the field without loss.
#
# Sanity values: Dapto 246, Thirroul 225, Wollongong CBD 214, Shellharbour 202,
# Kiama 163, Albion Park 147, Dharawal National Park 4, open sea 0.
#
# Row 0 is the northern edge, column 0 the western edge; row-major, one byte
# per sample, Base64.

rows=77
cols=57
north=-34.1458870
south=-34.6947658
west=150.6500
east=151.1400

