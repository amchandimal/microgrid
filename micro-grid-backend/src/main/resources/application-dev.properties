# --- Development -------------------------------------------------------------
# What `mvnw spring-boot:run` gets, and what the tests get. The Angular dev
# server calls this cross-origin from http://localhost:4200; serve the frontend
# on another port and this property has to follow it.
micro-grid.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# No reCAPTCHA here. Enterprise scores traffic against a site key registered to
# a domain, so localhost tokens would be meaningless even if Google would mint
# them - and requiring one would mean every developer needing Google Cloud
# credentials to load the map.
micro-grid.recaptcha.enabled=false
