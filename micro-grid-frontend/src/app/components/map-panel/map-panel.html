<div class="map-panel">
  <div class="map-toolbar">
    <form class="search" (submit)="onSubmit($event)" autocomplete="off">
      <svg class="search__icon" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
        <path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z" />
      </svg>
      <input
        type="text"
        class="search__input"
        placeholder="Search a suburb, street or landmark…"
        [value]="query()"
        (input)="onQueryChange($any($event.target).value)"
        (focus)="showResults.set(results().length > 0)"
      />
      @if (searching()) {
        <span class="search__spinner" aria-label="Searching"></span>
      }
      @if (query()) {
        <button type="button" class="search__clear" (click)="resetView()" title="Reset to Illawarra">✕</button>
      }

      @if (showResults()) {
        <ul class="search__results">
          @for (r of results(); track r.displayName) {
            <li>
              <button type="button" (click)="select(r)">{{ r.displayName }}</button>
            </li>
          }
        </ul>
      }
    </form>

    <button type="button" class="region-btn" (click)="resetView()">
      Illawarra, NSW
    </button>
  </div>

  <div class="map-host" #mapHost></div>

  <div class="map-legend">
    <span><i class="dot dot--supplier"></i> Energy supplier</span>
    <span><i class="dot dot--household"></i> Household</span>
    <span class="legend-count">{{ sites.length }} sites</span>
  </div>
</div>
