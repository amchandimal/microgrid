<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/">
      <span class="brand__mark">⚡</span>
      <div>
        <strong>G.E.D</strong>
        <small>Geospatial Energy Decision Platform</small>
      </div>
    </a>
    <nav class="topbar__nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Overview
      </a>
      <a routerLink="/grid-smart" routerLinkActive="active">How to Be Grid Smart</a>
      @if (isCouncil()) {
        <a routerLink="/council" routerLinkActive="active">Council dashboard</a>
        <button type="button" class="topbar__signout" (click)="signOut()">Sign out</button>
      } @else {
        <a routerLink="/login/council" routerLinkActive="active">Login</a>
      }
    </nav>
  </header>

  <main class="shell__body">
    <router-outlet />
  </main>
</div>
